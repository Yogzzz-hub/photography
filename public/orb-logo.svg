<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="1" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#orbGlow)" filter="url(#bloom)" />
  <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="rgba(255,255,255,0.25)" stroke-width="1" transform="rotate(-25 50 50)" />
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="rgba(168,85,247,0.35)" stroke-width="1" transform="rotate(35 50 50)" />
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" filter="url(#bloom)" />
</svg>
