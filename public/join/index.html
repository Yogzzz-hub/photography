<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyOrb Family Vault — Join Vault Invitation</title>
    <link rel="icon" type="image/svg+xml" href="/orb-logo.svg" />
    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          // Extract invite code if present to store in sessionStorage as a rock-solid backup
          var params = new URLSearchParams(search);
          var code = params.get('code') || params.get('invite');
          if (code) {
            sessionStorage.setItem('myorb_pending_invite_code', code);
          }
          // Redirect immediately to root preserving all search and hash parameters
          window.location.replace('/' + search + hash);
        } catch (e) {
          window.location.href = '/';
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #040508;
        color: #E5C07B;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(229, 192, 123, 0.2);
        border-top-color: #E5C07B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div style="font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">
      Connecting to MyOrb Family Vault...
    </div>
  </body>
</html>
